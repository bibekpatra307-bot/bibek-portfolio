<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Bibek Patra</title>
  <meta name="description" content="Get in touch with Bibek Patra for projects, collaborations, or just a friendly hello." />
  <link rel="canonical" href="https://bibekpatra.site/contact" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode:'class', theme: { extend: { colors: { primary:'#6C3BFF', secondary:'#111827', accent:'#F59E0B' } } } }</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/global.css" />
  <style>
    .whatsapp-float { position: fixed; bottom: 20px; right: 20px; background: #25D366; color: white; border-radius: 50%; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; animation: bounce 2s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #1f2937; color: white; padding: 16px 28px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); z-index: 9999; display: none; font-size: 16px; max-width: 90%; text-align: center; }
    .toast.success { background: #059669; }
    .toast.error { background: #dc2626; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-loading { opacity: 0.7; pointer-events: none; }
  </style>
</head>
<body class="bg-white text-gray-800 dark:bg-gray-900 dark:text-gray-200">
  <div id="navbar-placeholder"></div>

  <main class="pt-24 pb-20 max-w-3xl mx-auto px-4 text-center">
    <h1 class="text-4xl font-bold mb-8">Get In Touch</h1>
    <p class="mb-8 text-lg">Feel free to reach out for collaborations or just a friendly hello.</p>

    <!-- Social Links -->
    <div class="flex justify-center space-x-6 mb-10 text-3xl flex-wrap gap-4">
      <a href="mailto:inboxtobibek@gmail.com" class="hover:text-primary"><i class="fas fa-envelope"></i></a>
      <a href="https://wa.me/918280482686" target="_blank" class="hover:text-primary"><i class="fab fa-whatsapp"></i></a>
      <a href="https://www.instagram.com/itsbibekpatra" target="_blank" class="hover:text-primary"><i class="fab fa-instagram"></i></a>
      <a href="https://youtube.com/@gtbcreates" target="_blank" class="hover:text-primary"><i class="fab fa-youtube"></i></a>
      <a href="https://www.linkedin.com/in/bibek-patra-932213293" target="_blank" class="hover:text-primary"><i class="fab fa-linkedin"></i></a>
      <a href="https://www.facebook.com/thesideincomeguru" target="_blank" class="hover:text-primary"><i class="fab fa-facebook"></i></a>
    </div>

    <!-- Contact Form with EmailJS -->
    <form id="contactForm" class="space-y-4 max-w-md mx-auto text-left">
      <div>
        <label class="block text-sm font-medium mb-1">Full Name *</label>
        <input type="text" id="name" name="name" placeholder="Your full name" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-600 dark:bg-gray-700 focus:ring-2 focus:ring-primary focus:outline-none" required />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Email Address *</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-600 dark:bg-gray-700 focus:ring-2 focus:ring-primary focus:outline-none" required />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Phone Number</label>
        <input type="text" id="phone" name="phone" placeholder="+91 01234 56789" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-600 dark:bg-gray-700 focus:ring-2 focus:ring-primary focus:outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Subject *</label>
        <input type="text" id="subject" name="subject" placeholder="Project inquiry / Collaboration" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-600 dark:bg-gray-700 focus:ring-2 focus:ring-primary focus:outline-none" required />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Message *</label>
        <textarea id="message" name="message" placeholder="Tell me about your project..." class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-600 dark:bg-gray-700 focus:ring-2 focus:ring-primary focus:outline-none" rows="5" required></textarea>
      </div>
      <button type="submit" id="submitBtn" class="w-full bg-primary text-white px-8 py-3 rounded-xl hover:bg-purple-700 transition font-semibold text-lg flex items-center justify-center gap-2">
        <i class="fas fa-paper-plane"></i> Send Message
      </button>
      <p class="text-xs text-center text-gray-500 dark:text-gray-400 mt-2">Your data will be sent directly to inboxtobibek@gmail.com</p>
    </form>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Calendly alternative -->
    <div class="mt-12">
      <p class="mb-4 text-gray-600 dark:text-gray-400">Or schedule a free google meet:</p>
      <a href="https://calendar.app.google/jHgCFLD6dbbFr2r49" target="_blank" class="inline-block bg-accent text-black px-8 py-4 rounded-xl font-bold text-lg shadow-lg hover:bg-yellow-500 transition">📅 Book a Free meeting</a>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <a href="https://wa.me/918280482686" target="_blank" class="whatsapp-float" aria-label="Chat on WhatsApp"><i class="fab fa-whatsapp"></i></a>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 800, once: true });

    // ════════════════════════════════════════════════════════════════
    // ✅ आपकी अपनी VALUES (बिल्कुल सही डाली गई हैं)
    // ════════════════════════════════════════════════════════════════
    const SERVICE_ID = 'service_qnrvpzg';   // ⚠️ ध्यान दें: अगर यह काम न करे तो 'service_qnrwpzg' ट्राई करें
    const TEMPLATE_ID = 'template_if8e1af';
    const PUBLIC_KEY = 'My54mrabj2-NCpjcj';
    // ════════════════════════════════════════════════════════════════

    // EmailJS initialize
    emailjs.init(PUBLIC_KEY);

    const form = document.getElementById('contactForm');
    const btn = document.getElementById('submitBtn');
    const toast = document.getElementById('toast');

    function showToast(message, type = 'success') {
      toast.textContent = message;
      toast.className = 'toast ' + type;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 5000);
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      btn.innerHTML = '<span class="spinner"></span> Sending...';
      btn.classList.add('btn-loading');

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const subject = document.getElementById('subject').value.trim();
      const message = document.getElementById('message').value.trim();

      if (!name || !email || !subject || !message) {
        showToast('⚠️ Please fill in all required fields.', 'error');
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Message';
        btn.classList.remove('btn-loading');
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showToast('⚠️ Please enter a valid email address.', 'error');
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Message';
        btn.classList.remove('btn-loading');
        return;
      }

      try {
        await emailjs.send(SERVICE_ID, TEMPLATE_ID, {
          name: name,
          email: email,
          phone: phone || 'Not provided',
          subject: subject,
          message: message,
        });

        showToast('✅ Your message has been sent! I\'ll get back to you soon.', 'success');
        form.reset();
      } catch (error) {
        console.error('EmailJS Error:', error);
        showToast('❌ Something went wrong. Please email me directly at inboxtobibek@gmail.com', 'error');
      } finally {
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Message';
        btn.classList.remove('btn-loading');
      }
    });
  </script>
  <script src="/js/script.js"></script>
</body>
</html>
